    ptx_file: ../output/4_ptx/test_lifted_llc.ptx
    function: _Z15fc_layer_simplePfS_S_S_ii
    block: { x: 256 }
    args:
      - name: input
        type: float*
        size: 256
        init: random
        rng_seed: 777
        range: [0, 20.0]
      - name: weights
        type: float*
        size: 65536 # 256^2
        init: random
        rng_seed: 776
        range: [0, 20.0]
      - name: bias
        type: float*
        size: 256
        init: random
        rng_seed: 775
        range: [0, 20.0]
      - name: output
        type: float*
        size: 256
        init: zeros
        output: true
      - name: size
        type: int
        value: 256
      - name: output_size
        type: int
        value: 256
    verification:
      mode: benchmark_ptx
      tolerance:
        abs: 1e-5
        rel: 1e-6
      benchmark:
        ptx_file: ../output/4_ptx/test_clang_llc.ptx
        function: _Z15fc_layer_simplePfS_S_S_ii
